name: Code Review

on:
  push:
  pull_request:
    branches: [main]

jobs:
  review:
    name: 代码审查
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 需要完整历史

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 1. JS 语法检查（零依赖，纯解析不执行） ────────────────────
      - name: 🔍 JS 语法检查
        run: |
          echo "检查 src/ 下所有 .js 文件语法..."
          find src -name "*.js" -print0 | xargs -0 -I{} node --check "{}"
          echo "✅ 语法检查通过"

      # ── 2. ESLint ─────────────────────────────────────────────────
      - name: 📦 安装依赖
        run: npm ci

      - name: 🧹 ESLint 代码质量检查
        run: npm run lint:check

      # ── 3. 依赖安全扫描 ───────────────────────────────────────────
      - name: 🔒 依赖安全扫描 (npm audit)
        run: npm audit --audit-level=high
        continue-on-error: false

      # ── 4. 密钥/敏感信息扫描 ──────────────────────────────────────
      - name: 🕵️ 密钥扫描 (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
